services:
  postgres:
    image: postgres:16-alpine
    container_name: memica-postgres
    ports:
      - '5433:5432'
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - memica_postgres_data:/var/lib/postgresql/data

volumes:
  memica_postgres_data:
